name: Bootstrap TIM and EvoEdit

on:
  push:
    branches: [main]
    paths:
      - '.evoedit_overlay/chunks/**'
      - '.github/workflows/bootstrap-evoedit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard against completed bootstrap
        id: guard
        shell: bash
        run: |
          if compgen -G '.evoedit_overlay/chunks/part-*' > /dev/null; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Overlay chunks are absent; bootstrap has already completed.'
          fi

      - name: Reassemble and verify EvoEdit overlay
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .evoedit_overlay/chunks/part-* > /tmp/evoedit_overlay.tar.gz.b64
          base64 --decode /tmp/evoedit_overlay.tar.gz.b64 > /tmp/evoedit_overlay.tar.gz
          echo '567b7b02fc4a70f682fb62aa36794487437ef05e1e1cd4ff84c4a2951b8312ed  /tmp/evoedit_overlay.tar.gz' | sha256sum -c -
          mkdir -p /tmp/evoedit_overlay
          tar -xzf /tmp/evoedit_overlay.tar.gz -C /tmp/evoedit_overlay

      - name: Import TIM baseline and apply EvoEdit
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/yihengd/TIM.git /tmp/TIM
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '.evoedit_overlay' \
            -exec rm -rf {} +
          rsync -a --exclude='.git' /tmp/TIM/ ./
          rsync -a /tmp/evoedit_overlay/ ./
          python apply_overlay.py
          rm -f apply_overlay.py
          rm -rf .evoedit_overlay

      - name: Validate imported implementation
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            models/evoedit_modules.py \
            models/model_evoedit.py \
            configs/config.py
          bash -n scripts/evoedit_train.sh
          bash -n scripts/evoedit_test.sh

      - name: Commit implementation to main
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: implement EvoEdit on top of TIM'
          git push origin HEAD:main
